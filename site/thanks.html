<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050914"><link rel="stylesheet" href="/styles.css"><title>License ready — Super Lightning</title></head><body><main class="thanks"><p class="kicker">Payment received</p><h1>Your Super Lightning<br><em>license is ready.</em></h1><p id="message">Verifying your payment and preparing your signed license…</p><a id="download" class="button primary" hidden download="super-lightning.license.json">Download license</a><p><a class="button ghost" href="/">Return to Super Lightning</a></p></main><script>const id=new URLSearchParams(location.search).get('session_id');const message=document.querySelector('#message');const download=document.querySelector('#download');if(!id){message.textContent='We could not find a checkout session. Please contact Magnexis with your Stripe receipt.'}else{fetch('/.netlify/functions/license?session_id='+encodeURIComponent(id)).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{if(!ok)throw Error();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});download.href=URL.createObjectURL(blob);download.hidden=false;message.textContent='Save this license, then follow the installation instructions in the repository.'}).catch(()=>{message.textContent='Payment was received. Your license is still being prepared; refresh this page shortly or contact Magnexis with your receipt.'})}</script></body></html>
